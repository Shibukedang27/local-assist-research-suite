[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "local-assist-research-suite"
version = "0.1.0"
description = "Local-first assisted job, practice, and market research workflows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Local Assist Research Suite contributors"}]
dependencies = []

[project.optional-dependencies]
data = ["duckdb>=1.3,<2"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
local-assist = "local_assist.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_assist"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

